# Local PostgreSQL for development. Does not start the API.
# Usage from backend/: docker compose -f docker-compose.dev.yml up -d
#
# Then run: dotnet run --project src/Cheslax.Api/Cheslax.Api.csproj
# Connection string in appsettings.Development.json matches these credentials.

name: cheslax-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheslax
      POSTGRES_USER: cheslax
      POSTGRES_PASSWORD: cheslax
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cheslax_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheslax -d cheslax"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cheslax_pg_dev:
